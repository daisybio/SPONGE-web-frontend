<app-density-plot [rows]="rows()" [config]="config()" [loading]="plotResource.isLoading()"
  [combined]="isCombinedMode()" (combinedChange)="isCombinedMode.set($event)" [refreshSignal$]="refreshSignal$()">
  <p>
    Each shaded area is the distribution of SpongEffects enrichment scores across the TCGA reference cohort for one
    cancer class. Well-separated distributions indicate the model can better distinguish those classes.
  </p>
</app-density-plot>
