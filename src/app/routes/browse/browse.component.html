<mat-drawer-container style="min-height: 100%">
  <mat-drawer [opened]="true" mode="side">
    <app-form [browseService]="browseService" [selectedTab]="selectedTab()"></app-form>
    <!-- @if (rawDataURL$(); as rawDataURL) {
    <div class="card-container">
      <a target="_blank" [href]="rawDataURL" mat-flat-button>View raw data</a>
    </div>
    }-->
  </mat-drawer>
  <mat-drawer position="end" [opened]="true" mode="side">
    <app-cart-column [browseService]="browseService" [disabled]="cartDisabled()"></app-cart-column>
  </mat-drawer>
  <mat-drawer-content>
    <app-browse-views [browseService]="browseService" (selectedTabChange)="onSelectedTabChange($event)"></app-browse-views>
  </mat-drawer-content>
</mat-drawer-container>
