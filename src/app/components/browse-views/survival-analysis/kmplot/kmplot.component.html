@if (plotDataResource.isLoading() || plotDataResource.value()) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ getGenePrimary(gene().gene) }}
      </mat-card-title>
      <mat-card-subtitle>
        {{ gene().gene.ensg_number }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (plotDataResource.isLoading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <div #plot style="width: 700px"></div>
    </mat-card-content>
  </mat-card>
}
